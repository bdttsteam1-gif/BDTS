<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>최근 이슈 — Boditech MED</title>
<link rel="stylesheet" href="../assets/portal.css">
<style>
/* 최근 이슈 (2026-09-10) — 포털 메인에 있던 "최근 30일 클레임 TOP"을 별도 화면으로 옮겼습니다. */
html[data-bdts-page="issues"] .wrap{max-width:1400px}
.ht-head .h-grp.ht-grp{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
/* 최근 30일 클레임 TOP (assets/recent-issues.js) — 해외 = 청회색(slate blue), 국내 = 올리브(moss) */
.ht-wrap{margin:4px 0 10px;padding:0}
.ht-ov{--hc:#34597d;--hc-deep:#233f5a;--hc-soft:#dbe5ef}
.ht-dom{--hc:#55683f;--hc-deep:#3b4a2c;--hc-soft:#e2e9d8}
.ht-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.ht-head .h-grp.ht-grp{max-width:none!important;padding:0!important;margin:0!important;color:#2f3b2b!important}
.ht-period{font-size:12px;color:#5f5e56;font-weight:500}
.ht-panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:14px}
.ht-panel{background:#fff;border-top:3px solid var(--hc);padding:16px 18px 14px;min-width:0;container-type:inline-size}
.ht-ph{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;margin-bottom:12px;min-width:0}
.ht-tag{background:var(--hc);color:#fff;font:600 9.5px/1 var(--font-grotesk,inherit);letter-spacing:.14em;padding:5px 7px}
.ht-ph h3{font:700 19px/1.1 var(--font-display,inherit);letter-spacing:-.02em;color:var(--hc-deep)}
.ht-total{font:700 19px/1 var(--font-grotesk,inherit);color:var(--hc)}
.ht-total em,.ht-n em{font-style:normal;font-size:.7em;margin-left:2px;font-weight:600}
.ht-note{flex:1 1 auto;min-width:0;font-size:11.5px;color:#5f5e56;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht-note.ht-warn{color:#9a3412}
.ht-link{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--hc-deep);text-decoration:none;white-space:nowrap}
.ht-link:hover{text-decoration:underline}
/* 아이템 · LOT No. 는 대리점(거래처) 칸의 반씩 */
.ht-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,2fr);gap:14px}
.ht-col{min-width:0}
.ht-col h4{display:flex;align-items:baseline;gap:6px;min-width:0;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#4a4943;
  border-bottom:1px solid rgba(17,17,15,.16);padding-bottom:6px;margin-bottom:4px;white-space:nowrap}
.ht-col h4 small{min-width:0;overflow:hidden;text-overflow:ellipsis;letter-spacing:0;text-transform:none;font-weight:500;color:#6b6a62}
.ht-col h4 small::before{content:"· "}
.ht-col ol{list-style:none;margin:0;padding:0}
/* 줄 높이를 고정해 해외·국내 패널, 세 칸의 높이가 늘 같게 합니다 */
.ht-row{position:relative;display:flex;align-items:center;gap:8px;padding:0 4px;height:44px;
  border-bottom:1px dashed rgba(17,17,15,.09);cursor:pointer;outline-offset:-2px}
.ht-row:hover .ht-nm,.ht-row:focus-visible .ht-nm{text-decoration:underline;text-underline-offset:3px}
.ht-row:hover .ht-bar{filter:brightness(.95)}
.ht-bar{position:absolute;left:0;top:3px;bottom:3px;background:var(--hc-soft);z-index:0}
.ht-rk,.ht-nm,.ht-n{position:relative;z-index:1}
.ht-rk{width:16px;flex:0 0 16px;text-align:center;font:700 11px/1 var(--font-grotesk,inherit);color:var(--hc-deep)}
.ht-nm{flex:1;min-width:0;font-size:13px;font-weight:600;line-height:1.3;color:#11110f;word-break:break-all;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ht-nm.ht-one{display:flex;align-items:baseline;white-space:nowrap;word-break:normal;overflow:hidden}
.ht-one .ht-co{flex:0 1 auto;min-width:min(3.2em,40%);overflow:hidden;text-overflow:ellipsis}
.ht-one .ht-cty{flex:0 0 auto;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ht-nm small{display:block;font-size:11px;font-weight:500;color:#57564e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht-n{flex:0 0 auto;font:700 14.5px/1 var(--font-grotesk,inherit);color:var(--hc-deep)}
.ht-nm.ht-two{display:flex;flex-direction:column;justify-content:center;-webkit-line-clamp:unset}
.ht-two .ht-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht-row.ht-emp{cursor:default;border-bottom-style:dotted}
.ht-row.ht-emp .ht-nm{color:#c4c3bb;font-weight:500}
.ht-row.ht-emp .ht-rk{color:#c4c3bb}
.ht-row.ht-emp:hover .ht-nm{text-decoration:none}
/* 패널이 좁으면 아이템·LOT 두 칸(반씩) + 대리점(거래처) 한 줄 전체 */
@container (max-width: 700px){.ht-cols{grid-template-columns:repeat(2,minmax(0,1fr))}.ht-col:nth-child(3){grid-column:1 / -1}}
@container (max-width: 420px){.ht-cols{grid-template-columns:1fr}.ht-ph{flex-wrap:wrap}}
/* 클레임 모아 보기 팝업 — 화면 배율(zoom)이 걸려 있어 vh 는 --zoom 으로 나눠야 화면 안에 들어옵니다 */
html.ht-lock body{overflow:hidden}
.ht-modal{display:none;position:fixed;inset:0;z-index:800;background:rgba(17,17,15,.45);align-items:center;justify-content:center;padding:24px}
.ht-modal.on{display:flex}
.ht-modal.ht-ov{--hc:#34597d;--hc-deep:#233f5a;--hc-soft:#dbe5ef}
.ht-modal.ht-dom{--hc:#55683f;--hc-deep:#3b4a2c;--hc-soft:#e2e9d8}
.ht-mbox{background:#fff;width:min(1180px,100%);max-height:calc(88vh / var(--zoom, 1));display:flex;flex-direction:column;border-top:4px solid var(--hc);box-shadow:0 18px 50px rgba(0,0,0,.25)}
.ht-mhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid rgba(17,17,15,.12)}
.ht-mtitle{display:flex;flex-direction:column;gap:3px;min-width:0}
.ht-mtitle small{font-size:11px;font-weight:600;color:#5f5e56}
.ht-mtitle b{font-size:18px;font-weight:700;color:var(--hc-deep);word-break:break-all}
.ht-x{margin-left:auto;border:1px solid rgba(17,17,15,.2);background:#fff;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.ht-x:hover{background:#efeee7}
.ht-mbody{overflow:auto;padding:10px 20px 20px}
.ht-mhint{font-size:11.5px;color:#5f5e56;margin:2px 0 8px}
.ht-tbl table{width:100%;border-collapse:collapse;font-size:12.5px}
.ht-tbl th{position:sticky;top:-10px;background:var(--hc-soft);color:var(--hc-deep);font-size:11px;font-weight:700;text-align:left;padding:8px 10px;white-space:nowrap;z-index:1}
.ht-tbl td{padding:8px 10px;border-bottom:1px solid rgba(17,17,15,.08);vertical-align:top;color:#1d1d1a;font-weight:500;word-break:break-word}
.ht-tbl td.nw{white-space:nowrap}.ht-tbl td.b{font-weight:700;color:var(--hc-deep)}
.ht-tbl td.lot{white-space:pre-line;font-size:12px}
.ht-tbl tr[data-ht-i]{cursor:pointer}
.ht-tbl tr[data-ht-i]:hover td,.ht-tbl tr.open td{background:#f6f5ef}
.ht-det td{background:#fbfaf6;padding:12px 14px 16px}
.ht-dgrid{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 14px}
.ht-dk{font-size:11px;font-weight:700;color:var(--hc-deep);padding-top:2px}
.ht-dv{font-size:12.5px;line-height:1.6;color:#1d1d1a}
.ht-dv.pre{white-space:pre-wrap;max-height:260px;overflow:auto}
.ht-thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ht-thumbs img{width:84px;height:84px;object-fit:cover;border:1px solid rgba(17,17,15,.15);cursor:zoom-in}
.ht-st{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 7px}
.ht-st.open{background:var(--state-open,#c2532a);color:var(--state-open-on,#fff)}
.ht-st.done{background:var(--state-done,#10715a);color:var(--state-done-on,#fff)}
.ht-lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:2;align-items:center;justify-content:center;flex-direction:column;gap:10px;cursor:zoom-out}
.ht-lb.on{display:flex}
.ht-lb img{max-width:calc(92vw / var(--zoom, 1));max-height:calc(84vh / var(--zoom, 1));object-fit:contain}
.ht-lbcap{color:#fff;font-size:12px}
@media (max-width:760px){.ht-cols{grid-template-columns:1fr}
  .ht-modal{padding:0}.ht-mbox{max-height:calc(100vh / var(--zoom, 1));height:100%}.ht-dgrid{grid-template-columns:1fr}}
</style>
<!-- 디자인 레이어(Quiet Editorial Workspace): 겉모습만 바꿉니다. -->
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<nav class="b-nav">
  <a class="b-home" href="../index.html"><span>🏠</span>홈</a>
  <div class="b-brand">Boditech <span>MED</span></div>
  <div class="b-spacer"></div>
  <span class="b-who" id="who"></span>
</nav>

<section class="b-hero">
  <h1>최근 이슈 <em>Recent issues</em></h1>
  <p>최근 30일 동안 가장 많이 접수된 아이템 · LOT No. · 대리점(국내는 거래처)을 해외 · 국내로 나눠 보여줍니다. 항목을 누르면 해당 클레임만 모아 볼 수 있습니다.</p>
</section>

<div class="wrap">
  <!-- 해외: 통합 클레임 로그 / 국내: 기존 건은 통합 클레임 로그 + 새로 작성한 건은 클레임 로그 (국내) -->
  <section class="ht-wrap" id="recentIssues"></section>
</div>

(window.__bdtsAuthReady || Promise.resolve()).then(function () {
  var me = window.__bdtsUser || {}, w = document.getElementById('who');
  if (w && me.email) w.textContent = me.email + (me.isAdmin ? ' (관리자)' : '');

</body>
</html>
